<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://flagsapi.com" />
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <i class="fa-solid fa-wallet header-icon"></i>
        <h2>Currency Converter</h2>
      </div>
      <form>
        <div class="amount input-group">
          <label>Amount</label>
          <div class="input-wrapper">
            <input value="1" type="number" min="1" step="any" />
          </div>
        </div>
        <div class="dropdown">
          <div class="from input-group">
            <label>From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="Country Flag" loading="lazy" />
              <select name="from"></select>
            </div>
          </div>
          <div class="swap-icon-container">
            <i class="fa-solid fa-arrow-right-arrow-left swap-icon"></i>
          </div>
          <div class="to input-group">
            <label>To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="Country Flag" loading="lazy" />
              <select name="to"></select>
            </div>
          </div>
        </div>
        <div class="msg-container">
          <div class="msg">1 USD = 80 INR</div>
        </div>
        <button type="submit" class="convert-btn">
          <span>Get Exchange Rate</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
    <script src="code.js"></script>
    <script src="app.js"></script>
  </body>
</html>
